[package]
name = "launcher-qt"
version = "0.0.1"
edition = "2021"
# ADR-009: this binary links no QEMU code (it spawns the player as a
# separate process) and does link permissively licensed crates, so "or
# later" lets the combined binary go out under v3. Qt 6 itself is LGPLv3
# here, which GPL-2.0-only could not take and GPL-2.0-or-later can
# (`docs/07-frontend.md`).
license = "GPL-2.0-or-later"
description = "Companion launcher, Qt 6 / QML front end over launcher-core (cxx-qt)."

# Its own workspace, excluded from the root one, so a plain `cargo build`
# at the repository root never needs Qt 6 development files (the Mac
# side, CI, the Flatpak runtime). Build this crate explicitly, from this
# directory. The `launcher-core` path dependency crosses the workspace
# boundary without pulling Qt into the root.
[workspace]

[dependencies]
# Every window's state machine, the bundle format, the disc shelf,
# snapshots, shader profiles, the preview's render path and the
# toolkit-free debug verbs live here, so this front end is only view code.
launcher-core = { path = "../launcher-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
# The preview frame reaches QML through a BMP on disk (`preview.rs` says
# why), the only image encoding this crate does itself.
image = { version = "0.25", default-features = false, features = ["bmp"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
# The one the line above already uses, named for `QResourceFile`, which
# cxx-qt-build does not re-export: a resource from outside the crate
# needs an alias, or its `..` lands in the `qrc:` path.
qt-build-utils = { version = "0.10", default-features = false }
