[package]
name = "qemu-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust bindings for libqemu-embed (embed/libqemu_embed.h): QEMU in-process"
build = "build.rs"

[dependencies]
# libqemu-embed-<target> is opened at run time (`load`), one per machine.
libloading = "0.8"
