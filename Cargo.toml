[workspace]
resolver = "2"
members = ["player", "player-core", "libdisc", "libsynth", "gamepad", "launcher-core", "launcher-capi", "qemu-embed", "shader-chain"]
# `launcher-capi` is deliberately not a *default* member: it builds a
# `cdylib` and a `staticlib` of the whole launcher, which nobody needs
# unless they are building a front end in another language.
# `cargo check --workspace` (scripts/build.sh) is what keeps it from
# rotting; `cargo build -p launcher-capi` when you want it. The launcher
# itself is `launcher-mitsuami/`, its own workspace so that nothing here
# needs GTK (ADR-023); the egui front end that used to be a member here
# was retired on 2026-09-13 (ADR-017), and the Qt one on 2026-10-02.
default-members = ["player", "player-core", "libdisc", "libsynth", "gamepad", "launcher-core", "qemu-embed", "shader-chain"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# The default for crates that link QEMU (`player`, `qemu-embed`) or its
# device model (`libdisc`, `libsynth`). `launcher-core` and
# `shader-chain` opt out with `GPL-2.0-or-later` (ADR-009 in
# docs/10-decisions.md).
license = "GPL-2.0-only"
repository = "https://github.com/davidrios/2ksbox"

[profile.release]
lto = "thin"
