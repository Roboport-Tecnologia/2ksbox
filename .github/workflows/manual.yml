# Builds the user manual (manual/, Starlight) and publishes it to GitHub
# Pages. The only workflow that runs by itself: it builds HTML, no
# binaries (ADR-028) and no tests (docs/testing.md).
name: manual

on:
  push:
    branches: [main]
    paths:
      - 'manual/**'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manual
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0 # the pages' "last updated" dates come from git
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manual/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: manual/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
