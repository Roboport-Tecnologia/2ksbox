name: CI

# Manual-only for now (user request); restore push/pull_request triggers
# when we're ready to burn CI minutes.
on:
  workflow_dispatch:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (mandatory target, doc 02)
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: player binary present
        shell: bash
        run: ls -la target/release/player*

  qemu-prepare:
    name: qemu prepare + configure (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config zlib1g-dev libffi-dev libpixman-1-dev flex bison rsync
      - uses: astral-sh/setup-uv@v5
      # glib 2.90 wants meson 1.4; Ubuntu 24.04 packages 1.3
      - name: meson
        run: uv tool install meson
      - name: QEMU's own glib (pcre2, glib, libslirp; static)
        run: ./scripts/build-deps.sh
      - name: prepare (3dfx overlay + patch + sign)
        run: ./scripts/prepare-qemu.sh
      - name: configure (uv-managed python)
        run: ./scripts/configure-qemu.sh
      # TODO(M1): full cached QEMU build + link against the embed API
