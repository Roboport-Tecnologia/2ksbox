name: Build 2ksbox Windows x64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkgconf
            mingw-w64-i686-gcc
            nasm xorriso
      - name: Install Rust targets
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-msvc
      - name: Install project MSYS2 dependencies
        shell: msys2 {0}
        run: scripts/build-windows.sh --msys2-deps
      - name: Build Windows components
        shell: msys2 {0}
        run: scripts/build-windows.sh
      - name: Package Windows distribution
        shell: msys2 {0}
        run: scripts/package-windows.sh
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 2ksbox-windows-x64
          path: build/win/package/*windows-x86_64.zip
          if-no-files-found: error
