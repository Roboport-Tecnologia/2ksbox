# The Flatpak (M6 step 6b, doc 07's primary Linux target).
#
#   scripts/package-flatpak.sh          build + install + a smoke check
#
# Why a Flatpak: our QEMU is a patch queue, so no distro's `qemu` can be
# linked, and `libqemu-embed-i386.so` pulls ~191 shared libraries that the
# plain tarball ships none of. A runtime supplies that set on every
# distro. The sandbox is nominal (see `finish-args` below).
#
# The binaries MUST be built inside the SDK: the host's glibc is newer
# than the runtime's (2.44 vs 2.42 as of writing) and our embed library
# already references GLIBC_2.43, so host-built binaries will not run here.
#
# The runtime is KDE's, not freedesktop's, because the launcher is Qt 6 /
# QML (`launcher-qt`, ADR-015). `org.kde.Platform` ships Qt;
# `org.freedesktop.Platform` does not, and building Qt as a module here
# costs hours. 6.10 is a thin layer on `org.freedesktop.Platform` 25.08,
# so the rest of the build is unchanged: same glibc, same
# `org.freedesktop.Sdk.Extension.rust-stable//25.08`, same Python 3.13 for
# QEMU's configure.
app-id: com._2ksbox.Launcher
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: 2ksbox

# The Wine add-on (M15 step 7): a host below DXVK's Vulkan 1.3 floor runs
# the Direct3D executor in another process on Wine's d3d9 (ADR-018). The
# sandbox cannot run the host's Wine, and Flathub lists no second app, so
# the Wine and the executor's PE pair are an extension of this app,
# `com._2ksbox.Launcher.Wine` (`packaging/flatpak/` has its manifest),
# mounted at the directory the tarball uses for the pair. Not downloaded
# with the app: a host with a Vulkan 1.3 GPU never needs it. It follows
# this app's branch (`version` unset), and is removed with the app.
add-extensions:
  com._2ksbox.Launcher.Wine:
    directory: lib/2ksbox/wine
    no-autodownload: true
    autodelete: true

finish-args:
  # A machine is the point of the app: KVM when the host has it, the GPU
  # for the shader chain and the guest's 3D.
  - --device=kvm
  - --device=dri
  # A gamepad (M13). `--device=dri` does not cover /dev/input. Without
  # this the player's gilrs source silently sees no controller, which
  # looks the same as a host with nothing plugged in. `player --pads`
  # inside the sandbox tells the two apart.
  - --device=input
  # Wayland first, X11 as the fallback the player's winit build expects.
  # On a wlroots compositor the sandbox's socket never offers the
  # shortcut-inhibit protocol (doc 03 "Input path"), so host shortcuts
  # stay the host's there; a documented limitation, with a user override
  # to X11 (docs/development.md "Flatpak").
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  # QEMU's user-mode NAT gives the guest outbound networking, and the
  # shader-preset download fetches upstream's tarball.
  - --share=network
  # Disc images and qcow2s live wherever the user keeps them (an external
  # drive, a NAS mount), and a machine bundle stores absolute paths, so
  # they must resolve without a portal round-trip. That makes the
  # sandbox nominal. An honest `--filesystem=host` beats a narrower list
  # that fails on someone's second disk.
  - --filesystem=host

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/2ksbox/cargo
    # No uv in the SDK and no network during a Flathub build; the SDK's
    # own Python is 3.13, which is what QEMU 9.2.x wants
    # (scripts/configure-qemu.sh checks this rather than trusting it).
    QEMU_PYTHON: /usr/bin/python3

modules:
  # QEMU 9.2's mkvenv wants distlib and falls back to pip's vendored
  # copy. pip 26 (what the SDK ships) trimmed that copy
  # (`pip._vendor.distlib.scripts` is there, `...distlib.version` is
  # gone), so configure dies with "found no usable distlib". The real
  # package satisfies mkvenv's first choice. It is a build dependency
  # only, hence the cleanup. QEMU's configure sees it because the venv
  # inherits system site packages, /app/lib/python3.13/site-packages
  # included.
  - name: python3-distlib
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app distlib-0.4.3-py2.py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/02/08/9c41fb51ab5b43eb21674aff13df270e8ba6c4b29c8624e328dc7a9482af/distlib-0.4.3-py2.py3-none-any.whl
        sha256: 4b0ce306c966eb73bc3a7b6abad017c556dadd92c44701562cd528ac7fde4d5b

  - name: 2ksbox
    buildsystem: simple
    # No `--share=network`: the build is offline, as Flathub requires.
    # Every crate is a declared source with a checksum (cargo-sources.json,
    # regenerated by scripts/gen-flatpak-cargo-sources.sh), QEMU gets
    # `--disable-download` and has its meson wheel and softfloat
    # subprojects vendored in the submodule, and distlib is the module
    # above.
    sources:
      - type: dir
        path: ../..
        skip:
          # Build products and everything only a developer needs. The
          # QEMU submodule comes along *already patched*: the patch queue
          # (scripts/prepare-qemu.sh) needs git and rsync, neither of
          # which applies to a copied tree, so it runs on the host first.
          # QEMU's configure treats a tree with no .git as a tarball
          # build, which is what we want here.
          - target
          # `launcher-qt` is its own cargo workspace with its own
          # target/ (3+ GB). `target` above is a path from the source
          # root, not a name matched at every level.
          - launcher-qt/target
          - build
          - .git
          # `third_party/dxvk` is not skipped (63 MB, subprojects
          # vendored, no meson wraps, so the build stays offline). The
          # Direct3D executor needs its `include/native` headers to
          # compile, and its d3d9 has to link the runtime's libraries.
          # Patched on the host, like the QEMU tree above.
          - third_party/slang-shaders
          - .claude
      # Every crate of both lock files (the workspace's and
      # `launcher-qt/`'s) as declared sources, unpacked into
      # `cargo/vendor` with a `cargo/config` that redirects crates-io at
      # them; `CARGO_HOME` above points at that directory.
      - cargo-sources.json
      # QEMU's own glib (scripts/build-deps.sh, which on Linux builds
      # pcre2, glib and libslirp, static, into build/deps/<arch>, and
      # configure-qemu.sh links by default): the tarballs it pins, where
      # it looks for them before fetching, so the build stays offline.
      # libslirp is here rather than a module of its own, because the
      # runtime's has to be built against this glib. Versions and
      # checksums are build-deps.sh's.
      - type: file
        url: https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.48/pcre2-10.48.tar.bz2
        sha256: b6c68fdf6f3ac31388b50aa89ff0fc49c00c987c16e7b5146491d12003f2c8ed
        dest: build/deps/src
      - type: file
        url: https://download.gnome.org/sources/glib/2.90/glib-2.90.0.tar.xz
        sha256: 17d15cac2af80a33271127408e0abc2748eb297c595c2a26409e81e14e7d1b8f
        dest: build/deps/src
      - type: file
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.5/libslirp-v4.9.5.tar.gz
        sha256: f43e68b60b580647574ec4a0e2b6c600a56281e6c39f79426510832dc810f483
        dest: build/deps/src
    build-commands:
      - scripts/build-deps.sh
      # The steps a developer runs, then the tarball's staging script
      # with `<prefix>` = `/app`, so the install layout needs no
      # Flatpak-specific variant.
      - scripts/configure-qemu.sh --disable-download
      - ninja -C build/qemu qemu-img libqemu-embed-i386.so
      - cargo build --release --locked --offline -p player
      # `launcher-qt` is its own cargo workspace (ADR-015), so it is its
      # own build command; `CARGO_HOME` above points both at the one
      # vendored directory, which cargo-sources.json fills from both lock
      # files. cxx-qt-build finds Qt through `qmake6` in the SDK and
      # drives moc and qmltyperegistrar itself. There is no CMake step.
      - cd launcher-qt && cargo build --release --locked --offline
      # DXVK and the Direct3D executor (doc 14), for the same reason and
      # with the same constraint: the SDK has meson, ninja, glslang and
      # the Vulkan headers, DXVK's subprojects are vendored and it declares
      # no meson wrap, so this builds offline. Only `d3d9`, and only
      # against DXVK patch 04's headless WSI, because the executor never
      # presents. No Vulkan driver is packaged; the runtime's GL/Vulkan
      # extension supplies the host's. The SDK has no mingw, so this
      # builds the in-process executor and the remote library only; the
      # PE pair the remote library runs under Wine comes with the Wine
      # add-on (`add-extensions` above), into the directory made empty
      # here for it to mount on.
      - scripts/configure-dxvk.sh
      - ninja -C build/dxvk
      - scripts/build-d3dpt-exec.sh
      - scripts/package-linux.sh --no-build --prefix /app
      # The tarball stages the remote library only with the pair ("all or
      # none", doc 14). Here the pair is the add-on's, so the library the
      # app must carry is staged by hand, into the same place.
      - install -Dm755 build/d3dpt/libd3dpt_exec_remote.so -t /app/lib/2ksbox
      - mkdir -p /app/lib/2ksbox/wine
      # Flatpak exports these three by name, so they go where it looks
      # rather than through packaging/linux/install.sh (which rewrites
      # Exec/Icon to absolute paths for a plain prefix install; inside
      # the sandbox the shipped `Exec=2ksbox` / `Icon=<app-id>` are
      # already right).
      - install -Dm644 packaging/linux/com._2ksbox.Launcher.desktop /app/share/applications/com._2ksbox.Launcher.desktop
      - install -Dm644 packaging/linux/com._2ksbox.Launcher.metainfo.xml /app/share/metainfo/com._2ksbox.Launcher.metainfo.xml
      # The icon is a raster set, not one scalable file, so each size is
      # exported under its own directory. `package-linux.sh --prefix /app`
      # above already staged them; these are the same files put where
      # flatpak's export looks, and 128 is the size Flathub requires.
      - install -Dm644 packaging/icon/2ksbox-64.png /app/share/icons/hicolor/64x64/apps/com._2ksbox.Launcher.png
      - install -Dm644 packaging/icon/2ksbox-128.png /app/share/icons/hicolor/128x128/apps/com._2ksbox.Launcher.png
      - install -Dm644 packaging/icon/2ksbox-256.png /app/share/icons/hicolor/256x256/apps/com._2ksbox.Launcher.png
      - install -Dm644 packaging/icon/2ksbox-512.png /app/share/icons/hicolor/512x512/apps/com._2ksbox.Launcher.png
