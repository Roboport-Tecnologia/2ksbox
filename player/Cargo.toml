[package]
name = "player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone player: in-process QEMU + wgpu/librashader display (doc 02/03). M0: native window + test pattern."

# On by default, so what a build reads a gamepad with is decided here
# and not by what the machine happened to have, the same rule
# `configure-qemu.sh` follows for QEMU's optional libraries. The feature
# exists as a deliberate escape hatch, not as auto-detection: on Linux
# `gilrs` links libudev, and a host or sandbox without it builds with
# `--no-default-features` and gets a player whose only pad is
# `PLAYER_PAD_SCRIPT`.
[features]
default = ["gilrs"]
gilrs = ["dep:gilrs"]
# The player for Windows 11 (track M20): links libqemu-embed-x86_64
# instead of the era's i386. A second binary, built on its own
# (`scripts/build.sh`: `--features qemu-x86_64 --target-dir
# target/qemu-x86_64`), because QEMU has to be linked, not opened at run
# time: patch 63 reserves TCG's code buffer next to the helpers when the
# image loads, before main(), and a later dlopen loses that (doc 22 §5.0).
qemu-x86_64 = ["qemu-embed/qemu-x86_64"]

[dependencies]
qemu-embed = { path = "../qemu-embed" }
gamepad = { path = "../gamepad" }
gilrs = { version = "0.11", optional = true }
winit = "0.30"
libc = "0.2"
serde_json = "1"
ash = "0.38"

wgpu = "30"
pollster = "1"
bytemuck = "1"
png = "0.18"
cpal = "0.18.2"
shader-chain = { path = "../shader-chain" }

# The host's shortcuts to the guest while focused (src/kbcapture.rs). All
# of them are what winit already links; the versions follow its own (the
# macOS pair, objc2-app-kit and objc2-foundation, at the player's objc2).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11-dl = "2.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSWindow"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLTexture", "MTLPixelFormat", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef"] }
