[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
# The launcher's own licence, not the workspace's `GPL-2.0-only`
# (ADR-009). It links no QEMU code (it spawns the player), and it does
# link Apache-2.0 crates (`ring` under `ureq`'s rustls, `wgpu`'s tree),
# which GPLv2 cannot take and GPLv3 can.
license = "GPL-2.0-or-later"
description = "Everything the launcher does that is not drawing: bundles, the library, the disc shelf, snapshots, shader profiles, the window models and the debug verbs (doc 07)."

[features]
default = ["download"]
# The shader collection's download (`shader_source::fetch`); the player
# builds without it (track M22, its Disc menu).
download = ["dep:ureq"]

[dependencies]
# The Vulkan probe (`host_gpu.rs`, ADR-013), loaded dynamically, so a host
# with no `libvulkan` still starts the launcher. That host is the one the
# probe has to warn. Same crate and version the player uses for its
# dma-buf import.
ash = "0.38"
directories = "6.0.0"
# `drive::query` and friends, for the Storage page's optical drive: how a
# real drive can be read and how fast it goes (`host_drives`). Without the
# C API: the player links this crate and QEMU, which carries its own.
libdisc = { path = "../libdisc", default-features = false }
# `getxattr`, for the document portal's host-path attribute on a file a
# sandboxed dialog picked (`browse::picked`).
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
# `qemu-img info --output=json` for the snapshot list (a stable interface;
# `qemu-img snapshot -l`'s table is formatted for humans and doesn't
# escape a tag with a space in it). Same crate the player uses for QMP.
serde_json = "1"
toml = "1.1.5"
# Preset and parameter introspection only, no runtime backend. The profile
# editor lists a `.slangp`'s parameters to draw sliders from. The live
# preview runs the filter chain through `shader-chain`.
librashader = { version = "0.12", default-features = false, features = ["presets", "preprocess"] }
shader-chain = { path = "../shader-chain" }
# Decodes a preview screenshot (PNG/JPEG/BMP) into RGBA8 for the shader
# preview's input texture.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Fetching the upstream shader collection when it isn't on disk
# (`shader_source.rs`): a ~50 MB tarball over HTTPS, streamed through the
# gzip/tar decoders straight onto disk. `ureq` is blocking, which suits a
# front end with no async runtime; the download runs on its own thread.
# Its default TLS is rustls, so no system OpenSSL. Optional (`download`,
# below), so the player, which links this crate for the disc shelf, has no
# TLS stack (and no `ring`, ADR-009/010).
ureq = { version = "3", optional = true }
flate2 = "1"
tar = "0.4"
# `preview.rs` opens a windowless device of its own (`Preview::headless`,
# for the Qt build and the `--preview-shader` verb). Must stay on the
# version `shader-chain` pins, or the two see different `wgpu::Device`
# types.
wgpu = "30"
pollster = "1"

# Live control's monitor socket on Windows (`control.rs`): std has no
# `UnixStream` there, so the AF_UNIX client is three Winsock calls. This
# version is already in the lock through wgpu's tree. `CopyFileExW` is
# the clone's copy, for its progress callback (`clone_machine.rs`).
[target.'cfg(windows)'.dependencies]
# `host_drives.rs` lists the host's optical drives and USB disks with
# `GetDriveTypeW` and `DeviceIoControl` (`Win32_Foundation`, `Win32_System_IO`;
# `CreateFileW` is behind `Win32_Security`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
