# The player's picture inside a mitsuami window on GTK 4: the CRT chain
# renders into dma-buf images that GTK shows through GtkGraphicsOffload.
# Throwaway: not a workspace member, never packaged. README.md says what it
# measures.
[package]
name = "player-gtk-spike"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[workspace]

[dependencies]
# ~/work/mitsuami, next to this checkout
mitsuami = { path = "../../../mitsuami/crates/mitsuami" }
# mitsuami's own gtk4, with the 4.16 API on: GdkDmabufTextureBuilder (4.14)
# and GtkGraphicsOffload's black background (4.16)
gtk4 = { version = "0.11", features = ["v4_16"] }
qemu-embed = { path = "../../qemu-embed" }
shader-chain = { path = "../../shader-chain" }
wgpu = "30"
ash = "0.38"
pollster = "1"
bytemuck = "1"
libc = "0.2"
serde_json = "1"
cpal = "0.18.2"

# the baseline binary (src/bin/baseline.rs): the player's winit path, with
# presentation-time feedback over winit's Wayland connection
winit = "0.30"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
