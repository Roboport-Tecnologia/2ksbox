[package]
name = "player-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The player minus its window (doc 02/03): QEMU in-process, the picture through wgpu and the CRT chain, audio, gamepads. Driven by player-mitsuami (track M22)."

# The same switches the players had, forwarded by each front end. `gilrs`
# reads real gamepads (on Linux it links libudev; a host or sandbox
# without it builds with `--no-default-features` and gets only
# `PLAYER_PAD_SCRIPT`). The `qemu-*` features pick which libqemu-embed is
# linked: a second target is a second player binary, never a dlopen
# (patch 63, doc 22 §5.0).
[features]
default = ["gilrs"]
gilrs = ["dep:gilrs"]
qemu-x86_64 = ["qemu-embed/qemu-x86_64"]
qemu-aarch64 = ["qemu-embed/qemu-aarch64"]

[dependencies]
qemu-embed = { path = "../qemu-embed" }
gamepad = { path = "../gamepad" }
gilrs = { version = "0.11", optional = true }
libc = "0.2"
serde_json = "1"
ash = "0.38"
wgpu = "30"
pollster = "1"
bytemuck = "1"
png = "0.18"
# the user's Pictures folder, where shots go by default (the launcher's
# version, one entry in the lock)
directories = "6.0.0"
cpal = "0.18.2"
shader-chain = { path = "../shader-chain" }
# the host's clipboard, for the guest agent's (M23). On a Wayland desktop
# its data-control protocol, which reads and writes the clipboard with no
# window focused (X11 alone through Xwayland saw neither side's text on
# sway); X11 where the compositor has no such protocol
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# the machine's shared folder, served in this process (M23)
libsmb = { path = "../libsmb" }

[target.'cfg(target_os = "linux")'.dependencies]
# which screen the window is on (screen.rs): Wayland's presentation
# feedback on the toolkit's own connection, RandR on X11; the versions and
# features mitsuami already links, libwayland loaded at run time
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client"] }
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
# Win32_Graphics_Gdi, Win32_Devices_Display and Wdk_Graphics_Direct3D: the
# window's screen's refresh and vertical blank, Win32_Graphics_Dwm DWM's
# composition when that blank is refused (screen.rs); Win32_Networking_WinSock
# the shared folder's AF_UNIX listener (share.rs)
windows-sys = { version = "0.52", features = ["Win32_Media", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Devices_Display", "Wdk_Graphics_Direct3D", "Win32_Networking_WinSock"] }
# the scanout ring's shared Direct3D 12 resources (d3d12ring.rs, track
# M26): the version wgpu-hal's Direct3D 12 backend links, so its device
# and our resources are the same types
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
# the window's screen (screen.rs); its rate and blank are Core Video's
objc2 = "0.6"
# MTLHeap, MTLResource, MTLTypes, MTLAllocation: the scanout ring's heaps (metalring.rs,
# track M26)
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLTexture", "MTLPixelFormat", "objc2-io-surface", "MTLHeap", "MTLResource", "MTLTypes", "MTLAllocation"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef"] }
