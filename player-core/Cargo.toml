[package]
name = "player-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The player minus its window (doc 02/03): QEMU in-process, the picture through wgpu and the CRT chain, audio, gamepads. Shared by the winit player and the mitsuami one (track M22)."

# The same switches the players had, forwarded by each front end. `gilrs`
# reads real gamepads (on Linux it links libudev; a host or sandbox
# without it builds with `--no-default-features` and gets only
# `PLAYER_PAD_SCRIPT`). The `qemu-*` features pick which libqemu-embed is
# linked: a second target is a second player binary, never a dlopen
# (patch 63, doc 22 §5.0).
[features]
default = ["gilrs"]
gilrs = ["dep:gilrs"]
qemu-x86_64 = ["qemu-embed/qemu-x86_64"]
qemu-aarch64 = ["qemu-embed/qemu-aarch64"]

[dependencies]
qemu-embed = { path = "../qemu-embed" }
gamepad = { path = "../gamepad" }
gilrs = { version = "0.11", optional = true }
libc = "0.2"
serde_json = "1"
ash = "0.38"
wgpu = "30"
pollster = "1"
bytemuck = "1"
png = "0.18"
cpal = "0.18.2"
shader-chain = { path = "../shader-chain" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Media"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLTexture", "MTLPixelFormat", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef"] }
